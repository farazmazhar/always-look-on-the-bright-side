<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenCode — Agent Console</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-2: #101722;
    --panel: #141c2b;
    --panel-2: #1a2436;
    --border: #232f44;
    --border-2: #2f3d57;
    --text: #e8edf6;
    --muted: #7d8aa0;
    --accent: #22d3ee;
    --accent-2: #6366f1;
    --ok: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --radius: 14px;
    --r-sm: 9px;
  }
  [data-theme="light"] {
    --bg: #eef2f8;
    --bg-2: #f7f9fc;
    --panel: #ffffff;
    --panel-2: #eef2f9;
    --border: #dbe2ef;
    --border-2: #c4cedf;
    --text: #17233b;
    --muted: #64708a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  .shell { display: flex; height: 100vh; }

  /* ===== Session rail ===== */
  .rail {
    width: 260px; min-width: 260px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: transform 0.25s ease;
    z-index: 40;
  }
  .rail-head { padding: 16px; border-bottom: 1px solid var(--border); }
  .rail-head .logo-row { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
  .logo-dot { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-size: 13px; }

  .rail-search { margin: 12px 12px 8px; display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 10px; color: var(--muted); }
  .rail-search input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 13px; }
  .rail-search input::placeholder { color: var(--muted); }

  .new-btn { margin: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 7px; padding: 9px; border-radius: var(--r-sm); background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 13px; font-weight: 600; border: none; cursor: pointer; }
  .new-btn:hover { filter: brightness(1.08); }

  .session-list { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .session-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-sm); cursor: pointer; margin-bottom: 2px; }
  .session-item:hover { background: var(--panel); }
  .session-item.active { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  .session-item .s-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .session-item .s-body { flex: 1; min-width: 0; }
  .session-item .s-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .s-time { font-size: 10px; color: var(--muted); flex-shrink: 0; }

  .rail-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 9px; }
  .rail-foot .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #f472b6, #ef4444); display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
  .rail-foot .who { flex: 1; font-size: 12px; font-weight: 600; }
  .rail-foot .who small { display: block; font-weight: 400; color: var(--muted); }

  /* ===== Chat column ===== */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--bg); }
  .chat-head .menu { display: none; background: var(--panel); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: var(--r-sm); cursor: pointer; font-size: 16px; }
  .chat-head .title { flex: 1; min-width: 0; }
  .chat-head .title h2 { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-head .title .sub { font-size: 11px; color: var(--muted); }
  .icon-btn { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 15px; display: grid; place-items: center; }
  .icon-btn:hover { border-color: var(--border-2); }

  .thread { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; gap: 11px; max-width: 78%; animation: rise 0.25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg .avatar { width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0; display: grid; place-items: center; font-size: 14px; font-weight: 700; color: #fff; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .avatar { background: linear-gradient(135deg, #f472b6, #ef4444); }
  .msg.bot .avatar { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .bubble { padding: 11px 14px; border-radius: var(--r-sm); font-size: 14px; line-height: 1.55; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
  .bubble code { background: rgba(0,0,0,0.18); padding: 1px 6px; border-radius: 5px; font-family: 'SF Mono', ui-monospace, monospace; font-size: 12.5px; }
  .bubble pre { background: #0a0e16; color: #d7e0f0; padding: 12px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 12.5px; overflow-x: auto; margin: 8px 0; }
  .msg .time { font-size: 10px; color: var(--muted); margin-top: 5px; }

  .typing { display: flex; gap: 5px; padding: 6px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

  /* ===== Composer ===== */
  .composer { padding: 14px 20px 18px; border-top: 1px solid var(--border); background: var(--bg); }
  .chips { display: flex; gap: 7px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--panel); color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .composer-box { display: flex; align-items: flex-end; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
  .composer-box:focus-within { border-color: var(--accent); }
  .composer-box textarea { flex: 1; background: none; border: none; outline: none; resize: none; color: var(--text); font-size: 14px; font-family: inherit; line-height: 1.5; max-height: 140px; }
  .composer-box textarea::placeholder { color: var(--muted); }
  .send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 17px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
  .send-btn:hover { filter: brightness(1.1); }
  .composer-hint { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
  .composer-hint kbd { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-family: inherit; }

  /* ===== Context panel ===== */
  .context { width: 290px; min-width: 290px; background: var(--bg-2); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .ctx-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .ctx-tab { flex: 1; padding: 12px 6px; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; }
  .ctx-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .ctx-body { flex: 1; overflow-y: auto; padding: 14px; }
  .ctx-pane { display: none; }
  .ctx-pane.active { display: block; animation: rise 0.2s ease; }

  .ctx-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ctx-row:last-child { border-bottom: none; }
  .ctx-row .fname { flex: 1; font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctx-row .fmeta { font-size: 11px; color: var(--muted); }
  .ctx-row .ficon { color: var(--muted); font-size: 13px; }

  .metric { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 13px; margin-bottom: 10px; }
  .metric .m-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric .m-value { font-size: 20px; font-weight: 700; margin-top: 3px; }
  .metric .m-bar { height: 5px; background: var(--panel-2); border-radius: 99px; margin-top: 9px; overflow: hidden; }
  .metric .m-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width 0.8s ease; }

  /* ===== Command palette ===== */
  .palette { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; }
  .palette.show { display: flex; }
  .palette-box { width: 520px; max-width: 92vw; background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--radius); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: rise 0.15s ease; }
  .palette-input { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .palette-input input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 15px; }
  .palette-list { max-height: 320px; overflow-y: auto; padding: 6px; }
  .palette-item { display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; }
  .palette-item:hover, .palette-item.sel { background: var(--panel-2); }
  .palette-item .p-ico { width: 28px; height: 28px; border-radius: 7px; background: var(--panel-2); display: grid; place-items: center; color: var(--muted); }
  .palette-item .p-desc { color: var(--muted); font-size: 11px; }

  /* ===== Toasts ===== */
  .toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 10px; }
  .toast { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--border-2); border-left: 3px solid var(--accent); padding: 12px 15px; border-radius: 10px; font-size: 13px; min-width: 230px; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: rise 0.25s ease; }
  .toast.ok { border-left-color: var(--ok); }
  .toast.warn { border-left-color: var(--warn); }
  .toast.bad { border-left-color: var(--bad); }
  .toast.hide { opacity: 0; transform: translateX(20px); transition: 0.3s; }

  /* ===== Responsive ===== */
  @media (max-width: 1100px) { .context { position: fixed; right: 0; top: 0; bottom: 0; transform: translateX(100%); transition: transform 0.25s ease; } .context.open { transform: none; box-shadow: -20px 0 40px rgba(0,0,0,0.4); } }
  @media (max-width: 720px) {
    .rail { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); } .rail.open { transform: none; box-shadow: 20px 0 40px rgba(0,0,0,0.4); }
    .chat-head .menu { display: grid; place-items: center; }
    .msg { max-width: 94%; }
  }
</style>
</head>
<body>

<div class="shell">
  <!-- ===== Session rail ===== -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="logo-row"><div class="logo-dot">⌘</div> OpenCode Console</div>
      <div class="rail-search"><span>⌕</span><input id="sessionSearch" placeholder="Search sessions…"></div>
      <button class="new-btn" onclick="newSession()">＋ New session</button>
    </div>
    <div class="session-list" id="sessionList"></div>
    <div class="rail-foot">
      <div class="av">F</div>
      <div class="who">Faraz<small>deepseek-v4-pro</small></div>
      <button class="icon-btn" style="width:32px;height:32px;font-size:13px;" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </aside>

  <!-- ===== Chat ===== -->
  <main class="chat">
    <div class="chat-head">
      <button class="menu" onclick="toggle('rail')">☰</button>
      <div class="title">
        <h2 id="chatTitle">New session</h2>
        <div class="sub" id="chatSub">general · deepseek-v4-pro</div>
      </div>
      <button class="icon-btn" title="Context panel" onclick="toggle('context')">⧉</button>
      <button class="icon-btn" title="New session" onclick="newSession()">＋</button>
    </div>

    <div class="thread" id="thread"></div>

    <div class="composer">
      <div class="chips" id="chips"></div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message your agent…"></textarea>
        <button class="send-btn" onclick="send()" title="Send">➤</button>
      </div>
      <div class="composer-hint">
        <span>Prototype — no backend, mock replies only.</span>
        <span><kbd>Enter</kbd> send · <kbd>Ctrl K</kbd> commands</span>
      </div>
    </div>
  </main>

  <!-- ===== Context panel ===== -->
  <aside class="context" id="context">
    <div class="ctx-tabs">
      <button class="ctx-tab active" data-ctx="files">Files</button>
      <button class="ctx-tab" data-ctx="tools">Tools</button>
      <button class="ctx-tab" data-ctx="usage">Usage</button>
    </div>
    <div class="ctx-body">
      <div class="ctx-pane active" id="ctx-files"></div>
      <div class="ctx-pane" id="ctx-tools"></div>
      <div class="ctx-pane" id="ctx-usage"></div>
    </div>
  </aside>
</div>

<!-- ===== Command palette ===== -->
<div class="palette" id="palette">
  <div class="palette-box">
    <div class="palette-input"><span>⌕</span><input id="paletteInput" placeholder="Type a command…"></div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
/* ---------- State ---------- */
const SESSIONS = [
  { id: 1, title: 'Refactor auth module', meta: '3 files edited · completed', time: '2m', active: true, msgs: [
    { who: 'user', text: 'Refactor the auth module to use middleware instead of inline checks.' },
    { who: 'bot', text: 'Done. I moved the token verification into a <code>requireAuth</code> middleware and updated 3 route handlers. No logic change, just structure.' },
    { who: 'user', text: 'Show me the diff summary.' },
    { who: 'bot', text: 'Changed files:\n<pre>auth/middleware.js  +42 -18\nroutes/api.js       +6  -38\napp.js              +2  -2</pre>All tests still pass locally.' },
  ]},
  { id: 2, title: 'Add Stripe webhooks', meta: 'blocked on secret', time: '11m', active: false, msgs: [
    { who: 'user', text: 'Wire up Stripe webhook handling for the billing service.' },
    { who: 'bot', text: 'I drafted the webhook endpoint and signature verification, but I need the <code>STRIPE_WEBHOOK_SECRET</code> to continue. Add it to your env and I\'ll finish the wiring.' },
  ]},
  { id: 3, title: 'Write unit tests', meta: '12 tests · passed', time: '1h', active: false, msgs: [
    { who: 'user', text: 'Add unit tests for the billing service.' },
    { who: 'bot', text: 'Added 12 tests covering subscription lifecycle, proration and refunds. Coverage is now 91%.' },
  ]},
  { id: 4, title: 'Migrate to Go 1.23', meta: 'go.mod updated', time: '3h', active: false, msgs: [
    { who: 'user', text: 'Bump the module to Go 1.23 and fix any breaking changes.' },
    { who: 'bot', text: 'Updated <code>go.mod</code> and ran <code>go mod tidy</code>. One deprecated call in <code>os/exec</code> replaced. Builds clean.' },
  ]},
];

const FILES = [
  { icon: '{}', name: 'auth/middleware.js', meta: '+42' },
  { icon: 'λ', name: 'routes/api.js', meta: '+6' },
  { icon: '□', name: 'app.js', meta: '+2' },
  { icon: '✓', name: 'auth/middleware.test.js', meta: 'new' },
  { icon: '⚙', name: '.env.example', meta: 'mod' },
];

const TOOLS = [
  { name: 'read', desc: 'Read file contents', used: '12' },
  { name: 'grep', desc: 'Search codebase', used: '8' },
  { name: 'edit', desc: 'Edit file', used: '5' },
  { name: 'bash', desc: 'Run commands', used: '4' },
  { name: 'write', desc: 'Write file', used: '3' },
  { name: 'webfetch', desc: 'Fetch web page', used: '1' },
];

const CHIPS = ['Review my changes', 'Add tests', 'Explain this code', 'Optimize bundle size', 'Write a README'];

const BOT_REPLIES = [
  'I looked at the relevant files and here is my plan: (1) isolate the change behind a flag, (2) add a small test, (3) run the suite. Want me to proceed?',
  'Found the issue — it was a stale cache in <code>build/</code>. I cleared it and re-ran the build; it passes now.',
  'I drafted that for you. The change touches 2 files and is backward-compatible. Say the word and I\'ll apply it.',
  'Here\'s a quick summary of what I found:\n<pre>src/index.ts      uses memoization ✓\nlib/fetcher.ts    missing retry ✗\napi/client.ts     deprecated call ⚠</pre>',
  'Done. I added a focused regression test and it passes. Run <code>npm test</code> to verify on your machine.',
];

const COMMANDS = [
  { ico: '⌘', name: 'New session', desc: 'Start a clean conversation' },
  { ico: '⧉', name: 'Toggle context panel', desc: 'Show/hide files & tools' },
  { ico: '🌙', name: 'Toggle theme', desc: 'Switch light / dark' },
  { ico: '⌫', name: 'Clear messages', desc: 'Empty the current thread' },
  { ico: '🗑', name: 'Delete session', desc: 'Remove active session' },
];

let current = 1;
let paletteIdx = -1;

/* ---------- Render sessions ---------- */
function renderSessions(filter = '') {
  const list = document.getElementById('sessionList');
  list.innerHTML = SESSIONS.filter(s => s.title.toLowerCase().includes(filter.toLowerCase())).map(s => `
    <div class="session-item ${s.active ? 'active' : ''}" onclick="openSession(${s.id})">
      <div class="s-dot" style="background:${s.meta.includes('blocked') ? 'var(--warn)' : 'var(--ok)'}"></div>
      <div class="s-body">
        <div class="s-title">${s.title}</div>
        <div class="s-meta">${s.meta}</div>
      </div>
      <div class="s-time">${s.time}</div>
    </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px;">No matching sessions</div>';
}

function openSession(id) {
  const s = SESSIONS.find(x => x.id === id);
  if (!s) return;
  SESSIONS.forEach(x => x.active = false);
  s.active = true;
  current = id;
  document.getElementById('chatTitle').textContent = s.title;
  document.getElementById('chatSub').textContent = 'general · deepseek-v4-pro';
  renderThread();
  renderSessions(document.getElementById('sessionSearch').value);
  toggle('rail', false);
}

function renderThread() {
  const s = SESSIONS.find(x => x.id === current);
  const thread = document.getElementById('thread');
  if (!s || !s.msgs.length) {
    thread.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--muted);">
      <div style="font-size:44px;margin-bottom:12px;opacity:.5;">✦</div>
      <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px;">Start a conversation</div>
      <div style="font-size:13px;">Ask your agent to review, refactor, test or explain code.</div>
    </div>`;
    return;
  }
  thread.innerHTML = s.msgs.map((m, i) => `
    <div class="msg ${m.who}">
      <div class="avatar">${m.who === 'user' ? 'F' : '⌘'}</div>
      <div><div class="bubble">${m.text}</div><div class="time">${i === s.msgs.length - 1 ? 'just now' : (s.msgs.length - i) + ' min ago'}</div></div>
    </div>`).join('');
  thread.scrollTop = thread.scrollHeight;
}

/* ---------- Send / mock reply ---------- */
function send() {
  const input = document.getElementById('input');
  const val = input.value.trim();
  if (!val) return;
  const s = SESSIONS.find(x => x.id === current);
  s.msgs.push({ who: 'user', text: escapeHtml(val) });
  input.value = '';
  input.style.height = 'auto';
  renderThread();

  const reply = BOT_REPLIES[Math.floor(Math.random() * BOT_REPLIES.length)];
  const typing = document.createElement('div');
  typing.className = 'msg bot';
  typing.innerHTML = `<div class="avatar">⌘</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  document.getElementById('thread').appendChild(typing);
  document.getElementById('thread').scrollTop = document.getElementById('thread').scrollHeight;

  setTimeout(() => {
    s.msgs.push({ who: 'bot', text: reply });
    renderThread();
    renderSessions(document.getElementById('sessionSearch').value);
    toast('Agent replied', 'ok');
  }, 900 + Math.random() * 600);
}

function escapeHtml(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------- New session ---------- */
function newSession() {
  const id = Math.max(...SESSIONS.map(s => s.id)) + 1;
  SESSIONS.forEach(s => s.active = false);
  SESSIONS.push({ id, title: 'New session', meta: 'draft', time: 'now', active: true, msgs: [] });
  current = id;
  document.getElementById('chatTitle').textContent = 'New session';
  renderThread();
  renderSessions();
  toggle('rail', false);
  toast('New session created');
  document.getElementById('input').focus();
}

/* ---------- Context panel ---------- */
function renderContext() {
  document.getElementById('ctx-files').innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Changed in this session</div>' +
    FILES.map(f => `<div class="ctx-row"><span class="ficon">${f.icon}</span><span class="fname">${f.name}</span><span class="fmeta">${f.meta}</span></div>`).join('');

  document.getElementById('ctx-tools').innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:10px;">Tool calls</div>' +
    TOOLS.map(t => `<div class="ctx-row"><span class="ficon">⬢</span><div class="fname" style="font-family:inherit;font-weight:600;">${t.name}</div><span class="fmeta">${t.used}×</span></div>
      <div style="padding-left:26px;margin:-6px 0 8px;font-size:11px;color:var(--muted);">${t.desc}</div>`).join('');

  document.getElementById('ctx-usage').innerHTML = [
    { label: 'Input tokens', val: '24,180', pct: 62 },
    { label: 'Output tokens', val: '3,442', pct: 24 },
    { label: 'Cost (est.)', val: '$0.031', pct: 8 },
  ].map(m => `<div class="metric"><div class="m-label">${m.label}</div><div class="m-value">${m.val}</div><div class="m-bar"><i data-w="${m.pct}"></i></div></div>`).join('');
  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll('.m-bar i').forEach(b => b.style.width = b.dataset.w + '%');
  }, 100));
}

document.querySelectorAll('.ctx-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.ctx-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('.ctx-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('ctx-' + t.dataset.ctx).classList.add('active');
  });
});

/* ---------- Command palette ---------- */
function renderPalette(filter = '') {
  const list = COMMANDS.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
  document.getElementById('paletteList').innerHTML = list.map((c, i) => `
    <div class="palette-item ${i === paletteIdx ? 'sel' : ''}" onclick="runCommand('${c.name}')">
      <div class="p-ico">${c.ico}</div>
      <div><div>${c.name}</div><div class="p-desc">${c.desc}</div></div>
    </div>`).join('') || '<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px;">No commands found</div>';
}

function runCommand(name) {
  closePalette();
  if (name === 'New session') newSession();
  else if (name === 'Toggle context panel') toggle('context');
  else if (name === 'Toggle theme') toggleTheme();
  else if (name === 'Clear messages') { const s = SESSIONS.find(x => x.id === current); s.msgs = []; renderThread(); toast('Thread cleared', 'warn'); }
  else if (name === 'Delete session') deleteSession();
}

function deleteSession() {
  const idx = SESSIONS.findIndex(s => s.id === current);
  if (SESSIONS.length <= 1) { toast('Cannot delete the last session', 'warn'); return; }
  SESSIONS.splice(idx, 1);
  current = SESSIONS[0].id;
  SESSIONS[0].active = true;
  document.getElementById('chatTitle').textContent = SESSIONS[0].title;
  renderThread(); renderSessions();
  toast('Session deleted', 'warn');
}

function openPalette() { document.getElementById('palette').classList.add('show'); paletteIdx = 0; renderPalette(); document.getElementById('paletteInput').focus(); }
function closePalette() { document.getElementById('palette').classList.remove('show'); document.getElementById('paletteInput').value = ''; }

/* ---------- Helpers ---------- */
function toggle(id, force) {
  const el = document.getElementById(id);
  if (force !== undefined) { el.classList.toggle('open', force); return; }
  el.classList.toggle('open');
}

function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
  toast('Theme switched to ' + next);
}

function toast(msg, kind = 'ok') {
  const icons = { ok: '✅', warn: '⚠️', bad: '❌' };
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<span>${icons[kind]}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 300); }, 2800);
}

/* ---------- Events ---------- */
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
});
document.getElementById('sessionSearch').addEventListener('input', e => renderSessions(e.target.value));
document.getElementById('paletteInput').addEventListener('input', e => { paletteIdx = 0; renderPalette(e.target.value); });
document.getElementById('paletteInput').addEventListener('keydown', e => {
  const items = document.querySelectorAll('.palette-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); paletteIdx = Math.min(paletteIdx + 1, items.length - 1); renderPalette(document.getElementById('paletteInput').value); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); paletteIdx = Math.max(paletteIdx - 1, 0); renderPalette(document.getElementById('paletteInput').value); }
  else if (e.key === 'Enter' && items[paletteIdx]) { items[paletteIdx].click(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
  if (e.key === 'Escape') closePalette();
});
document.getElementById('palette').addEventListener('click', e => { if (e.target.id === 'palette') closePalette(); });

/* chips */
const chipsWrap = document.getElementById('chips');
chipsWrap.innerHTML = CHIPS.map(c => `<button class="chip" onclick="useChip('${c}')">${c}</button>`).join('');
function useChip(c) {
  const input = document.getElementById('input');
  input.value = c;
  input.dispatchEvent(new Event('input'));
  input.focus();
}

/* ---------- Init ---------- */
renderSessions();
renderThread();
renderContext();
</script>
</body>
</html>
